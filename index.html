<div class="x-loader x-loader--screen" id="xsplash" hidden role="status" aria-live="polite"><span class="x-loader__plate"><img src="brand/logo_compact.png" alt="Dupedia" width="240" height="124"></span><div class="x-band x-band--wait" id="xs-band" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="x-loader__text" id="xs-t">Initializing X FORCE</p><p class="x-loader__sub" id="xs-s"></p><div class="x-loader__acts" id="xs-a" hidden></div></div>
<script>/* 2.0 (Session 3): start-up loader. Shows the four real start-up steps (never a percentage: their length is unknown),
   says "still working" after 20 s without a new step, offers Reload / Continue after 60 s, and leaves as soon as the first page
   has rendered (DPShell calls XFSplash.done) or the sign-in gate appears. */
(function(){var el=document.getElementById("xsplash");if(!el)return;var band=document.getElementById("xs-band"),bl=band.children,t=document.getElementById("xs-t"),s=document.getElementById("xs-s"),a=document.getElementById("xs-a"),slowT=0,outT=0,over=false,N=4;
function arm(){clearTimeout(slowT);clearTimeout(outT);s.textContent="";a.hidden=true;slowT=setTimeout(function(){if(!over)s.textContent="Still working. This is taking longer than usual.";},20000);outT=setTimeout(stuck,60000);}
function stuck(){if(over)return;el.classList.add("is-error");t.textContent="X FORCE has not finished loading after 60 seconds.";s.textContent="Your data is safe. Reload to try again, or continue to see what has loaded.";a.hidden=false;
a.innerHTML='<button type="button" class="x-btn x-btn--primary" id="xs-r">Reload</button><button type="button" class="x-btn x-btn--ghost" id="xs-c">Continue</button>';document.getElementById("xs-r").onclick=function(){location.reload();};document.getElementById("xs-c").onclick=function(){done(true);};document.getElementById("xs-r").focus();}
function step(i,label){if(over)return;band.classList.remove("x-band--wait");for(var k=0;k<bl.length;k++)bl[k].classList.toggle("is-on",k<i);t.textContent=label+" · "+(i+1)+" of "+N;arm();}
function done(now){if(over)return;over=true;clearTimeout(slowT);clearTimeout(outT);band.classList.remove("x-band--wait");for(var k=0;k<bl.length;k++)bl[k].classList.add("is-on");s.textContent="";a.hidden=true;el.classList.remove("is-error");
var rm=matchMedia("(prefers-reduced-motion: reduce)").matches||now;setTimeout(function(){el.classList.add("is-leaving");setTimeout(function(){el.hidden=true;el.classList.remove("is-leaving");},rm?0:320);},rm?0:260);}
window.XFSplash={step:step,done:done,hide:function(){over=true;clearTimeout(slowT);clearTimeout(outT);el.hidden=true;}};
try{sessionStorage.removeItem("xf.splash");}catch(e){}el.hidden=false;arm();})();</script>
